# Save this as .github/workflows/deploy.yml in your repo
# (asthaparoha-nt/Devops-Capstone) after the Terraform above is applied.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # required to request the OIDC JWT
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::984220190731:role/github-actions-devops-capstone
          aws-region: us-east-1

      - name: Verify identity
        run: aws sts get-caller-identity

      # - name: Terraform / deploy steps
      #   run: |
      #     terraform init
      #     terraform apply -auto-approve
