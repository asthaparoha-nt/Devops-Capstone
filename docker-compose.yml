services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assessment-backend
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: "mongodb://mongodb:27017"
      DATABASE_NAME: "assessment_portal"
      SECRET_KEY: "change-this-secret-key"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    depends_on:
      - mongodb

  mongodb:
    image: "mongo:7"
    container_name: assessment-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assessment-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data: