name: CD - Deploy Assessment Portal

on:
  push:
    branches:
      - master
      - feature/infracode

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "984220190731"

jobs:
  deploy:
    name: Deploy Backend and Frontend
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout Repository
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Configure AWS using GitHub OIDC
      # ==========================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::984220190731:role/github-actions-devops-capstone
          aws-region: us-east-1


      # ==========================================================
      # 3. Find Running K3s Master
      # ==========================================================
      - name: Find K3s Master
        shell: bash
        run: |

          MASTER_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Role,Values=k3s-master" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text \
            --region "$AWS_REGION")

          if [ "$MASTER_INSTANCE_ID" = "None" ] || [ -z "$MASTER_INSTANCE_ID" ]; then
            echo "ERROR: Running K3s master not found."
            exit 1
          fi

          echo "K3s Master Instance ID: $MASTER_INSTANCE_ID"

          echo "MASTER_INSTANCE_ID=$MASTER_INSTANCE_ID" >> "$GITHUB_ENV"


      # ==========================================================
      # 7. Deploy Application to K3s
      # ==========================================================
      - name: Deploy application using SSM
        shell: bash
        run: |

          echo "Starting Kubernetes deployment..."
          BACKEND_YAML=$(base64 -w 0 terraform/modules/k8s/backend.yaml)
          FRONTEND_YAML=$(base64 -w 0 terraform/modules/k8s/frontend.yaml)
          DEPLOY_COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$MASTER_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Assessment Portal to K3s" \
            --parameters 'commands=[
              "set -e",
              "mkdir -p /tmp/deployments",
              "echo '$BACKEND_YAML' | base64 -d > /tmp/deployments/backend.yaml",
              "echo '$FRONTEND_YAML' | base64 -d > /tmp/deployments/frontend.yaml",
              "echo ===== Kubernetes Nodes =====",
              "kubectl get nodes -o wide",

              "echo ===== Applying Backend =====",
              "kubectl apply -f /tmp/deployments/backend.yaml",

              "echo ===== Applying Frontend =====",
              "kubectl apply -f /tmp/deployments/frontend.yaml",

              "echo ===== Backend Rollout =====",
              "kubectl rollout status deployment/assessment-portal-backend --timeout=180s",

              "echo ===== Frontend Rollout =====",
              "kubectl rollout status deployment/assessment-portal-frontend --timeout=180s",

              "echo ===== Pods =====",
              "kubectl get pods -o wide",

              "echo ===== Services =====",
              "kubectl get svc",

              "echo ===== Ingress =====",
              "kubectl get ingress"
            ]' \
            --region "$AWS_REGION" \
            --output text \
            --query "Command.CommandId")

          echo "DEPLOY_COMMAND_ID=$DEPLOY_COMMAND_ID" >> "$GITHUB_ENV"

          echo "Deployment SSM Command ID: $DEPLOY_COMMAND_ID"


      # ==========================================================
      # 8. Wait for Kubernetes Deployment
      # ==========================================================
      - name: Wait for Kubernetes deployment
        shell: bash
        run: |

          for i in {1..36}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$DEPLOY_COMMAND_ID" \
              --instance-id "$MASTER_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text)

            echo "Deployment Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "======================================"
              echo "Deployment completed successfully."
              echo "======================================"
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "======================================"
              echo "Deployment FAILED."
              echo "======================================"

              echo "===== Standard Error ====="

              aws ssm get-command-invocation \
                --command-id "$DEPLOY_COMMAND_ID" \
                --instance-id "$MASTER_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "StandardErrorContent" \
                --output text

              echo "===== Standard Output ====="

              aws ssm get-command-invocation \
                --command-id "$DEPLOY_COMMAND_ID" \
                --instance-id "$MASTER_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "StandardOutputContent" \
                --output text

              exit 1
            fi

            sleep 10

          done

          echo "ERROR: Kubernetes deployment timed out."
          exit 1


      # ==========================================================
      # 9. Display Final Kubernetes Status
      # ==========================================================
      - name: Show final deployment status
        if: always()
        shell: bash
        run: |

          echo "======================================"
          echo "FINAL DEPLOYMENT STATUS"
          echo "======================================"

          if [ -n "${DEPLOY_COMMAND_ID:-}" ]; then

            aws ssm get-command-invocation \
              --command-id "$DEPLOY_COMMAND_ID" \
              --instance-id "$MASTER_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "StandardOutputContent" \
              --output text

          fi