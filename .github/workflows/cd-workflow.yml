name: CD - Deploy to Private K3s

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "984220190731"

jobs:
  deploy:
    name: Deploy Backend and Frontend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::984220190731:role/github-actions-devops-capstone
          aws-region: us-east-1

      - name: Find K3s Master
        run: |
          MASTER_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Role,Values=k3s-master" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text \
            --region "$AWS_REGION")

          if [ "$MASTER_INSTANCE_ID" = "None" ] || [ -z "$MASTER_INSTANCE_ID" ]; then
            echo "K3s master not found"
            exit 1
          fi

          echo "MASTER_INSTANCE_ID=$MASTER_INSTANCE_ID" >> "$GITHUB_ENV"

      - name: Deploy using SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$MASTER_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Assessment Portal" \
            --parameters 'commands=[
              "set -e",
              "export KUBECONFIG=/home/ec2-user/.kube/config",

              "echo ===== Applying Backend =====",
              "kubectl apply -f /home/ec2-user/backend.yaml || true",

              "echo ===== Applying Frontend =====",
              "kubectl apply -f /home/ec2-user/frontend.yaml || true",

              "echo ===== Refreshing Backend =====",
              "kubectl rollout restart deployment/assessment-portal-backend",

              "echo ===== Refreshing Frontend =====",
              "kubectl rollout restart deployment/assessment-portal-frontend",

              "echo ===== Waiting for Backend =====",
              "kubectl rollout status deployment/assessment-portal-backend --timeout=180s",

              "echo ===== Waiting for Frontend =====",
              "kubectl rollout status deployment/assessment-portal-frontend --timeout=180s",

              "echo ===== Deployment Status =====",
              "kubectl get pods -o wide",

              "echo ===== Services =====",
              "kubectl get svc",

              "echo ===== Ingress =====",
              "kubectl get ingress"
            ]' \
            --region "$AWS_REGION" \
            --output text \
            --query "Command.CommandId")

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM deployment
        run: |
          for i in {1..36}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$MASTER_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text)

            echo "SSM Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful"
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "Deployment failed"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$MASTER_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "StandardErrorContent" \
                --output text

              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out"
          exit 1

      - name: Show deployment output
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$MASTER_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" \
            --output text